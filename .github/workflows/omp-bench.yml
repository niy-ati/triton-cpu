name: OpenMP interference benchmark

on:
  push:
    branches: [bench-omp-interference]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      TRITON_BUILD_WITH_CLANG_LLD: "TRUE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout Triton
        run: |
          git clone --filter=blob:none https://github.com/triton-lang/triton.git triton
          cd triton && git checkout -q "$(cat ../triton.txt)" && git submodule update --init --recursive -q
          git apply -v ${GITHUB_WORKSPACE}/.github/patches/*.patch
      - name: Install brew dependencies
        run: brew install ccache llvm@20 lld coreutils libomp boost
      - name: Install torch and Triton
        working-directory: ./triton
        env:
          TRITON_BUILD_WITH_O1: "true"
          MAX_JOBS: 3
        run: |
          python3 -m venv ~/.venv && source ~/.venv/bin/activate
          python -m pip install -q --upgrade pip
          python -m pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/test/cpu
          export PATH="/opt/homebrew/opt/llvm@20/bin:$PATH"
          export CC=/opt/homebrew/opt/llvm@20/bin/clang CXX=/opt/homebrew/opt/llvm@20/bin/clang++
          export CXXFLAGS="-stdlib=libc++" LDFLAGS="-L/opt/homebrew/opt/llvm@20/lib"
          TRITON_PLUGIN_DIRS=${GITHUB_WORKSPACE} make dev-install
      - name: Benchmarks
        env:
          TRITON_DEFAULT_BACKEND: cpu
          MPLBACKEND: Agg
        run: |
          source ~/.venv/bin/activate
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.perflevel0.physicalcpu hw.perflevel1.physicalcpu || true
          cd bench
          python omp_which.py
          for i in 1 2 3; do
            python interleave.py "macOS default"
            KMP_BLOCKTIME=1 python interleave.py "macOS blocktime=1ms"
          done
          for i in 1 2 3; do
            python realistic.py "macOS default"
            KMP_BLOCKTIME=1 python realistic.py "macOS blocktime=1ms"
          done
          python compute_alone.py "macOS default"
          KMP_BLOCKTIME=1 python compute_alone.py "macOS blocktime=1ms"

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TRITON_BUILD_WITH_CLANG_LLD: "TRUE"
    steps:
      - name: Install boost
        run: sudo apt-get update -q && sudo apt-get install -y -q ccache libboost-fiber-dev
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout Triton
        run: |
          git clone --filter=blob:none https://github.com/triton-lang/triton.git triton
          cd triton && git checkout -q "$(cat ../triton.txt)" && git submodule update --init --recursive -q
          git apply -v ${GITHUB_WORKSPACE}/.github/patches/*.patch
      - name: Install torch and Triton
        working-directory: ./triton
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/test/cpu
          MAX_JOBS=4 TRITON_PLUGIN_DIRS=${GITHUB_WORKSPACE} make dev-install
      - name: Benchmarks
        env:
          TRITON_DEFAULT_BACKEND: cpu
          MPLBACKEND: Agg
        run: |
          nproc; lscpu | grep -E "Model name|Thread"
          cd bench
          for cxx in g++ clang++; do
            export CXX=$(which $cxx)
            [ "$cxx" = clang++ ] && export CC=$(which clang) || export CC=$(which gcc)
            export TRITON_CACHE_DIR=$HOME/.triton/cache_$cxx
            echo "===== launcher built with $cxx"
            python omp_which.py
            for i in 1 2 3; do
              python interleave.py "linux $cxx default"
              KMP_BLOCKTIME=1 python interleave.py "linux $cxx blocktime=1ms"
              python realistic.py "linux $cxx default"
              KMP_BLOCKTIME=1 python realistic.py "linux $cxx blocktime=1ms"
            done
            python compute_alone.py "linux $cxx default"
          done
